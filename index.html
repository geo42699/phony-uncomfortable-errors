<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقعي التعليمي</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;margin:0;padding:10px}
.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}
button{padding:10px 14px;border:none;border-radius:8px;margin:4px;font-weight:700;cursor:pointer}
.btnY{background:#eab308;color:#000}
.btnD{background:#333;color:#fff}
.btnP{background:#a855f7;color:#fff}
input{padding:10px;border-radius:8px;background:#111;color:#fff;border:1px solid #444;width:100%;margin:4px 0}
.grid{display:grid;gap:6px}
.xo{grid-template-columns:repeat(3,1fr);max-width:240px;margin:auto}
.xocell{background:#2a2a2a;height:70px;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:8px;cursor:pointer}
.mem{grid-template-columns:repeat(4,1fr);max-width:300px;margin:auto}
.memcard{background:#2a2a2a;height:60px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
nav{display:flex;gap:6px;justify-content:center;margin:10px 0}
#pts{position:fixed;top:8px;left:8px;background:#eab308;color:#000;padding:6px 12px;border-radius:20px;font-weight:900}
</style>
</head>
<body>
<div id="pts">⭐ <span id="myPoints">0</span></div>
<h1 style="text-align:center;color:#a855f7">🎮 موقعي التعليمي</h1>
<nav>
<button class="btnP" onclick="showSec('games')">🎮 ألعاب</button>
<button class="btnY" onclick="showSec('calc')">🧮 ذكية</button>
<button class="btnP" onclick="showSec('code')">💻 برمجة</button>
<button class="btnY" onclick="showSec('rank')">🏆 التصنيف</button>
</nav>
<div id="games" class="card">
<h2>1- XO (سهل2 متوسط3 صعب10)</h2>
<button class="btnD" onclick="setDiff('easy')">سهل 2</button>
<button class="btnY" onclick="setDiff('medium')">متوسط 3</button>
<button class="btnD" onclick="setDiff('hard')">صعب 10</button>
<div id="xoStatus" style="text-align:center;margin:6px"></div>
<div id="xoBoard" class="grid xo"></div>
<button class="btnD" onclick="resetXO()">إعادة</button>
<h2>2- الذاكرة 4x4 =4</h2>
<div id="memGrid" class="grid mem"></div>
<button class="btnY" onclick="initMem()">ابدأ</button>
<h2>3- التخمين 1-100 =5</h2>
<p id="guessHint">خمن 1-100</p>
<input type="number" id="guessInput" placeholder="1-100">
<button class="btnY" onclick="checkGuess()">خمن</button>
<button class="btnD" onclick="resetGuess()">جديد</button>
</div>
<div id="calc" class="card" style="display:none">
<h2>🧮 آلة حاسبة = صفرا</h2>
<div id="calcDisp" style="background:#000;color:#0f0;padding:12px;font-size:24px;text-align:left;direction:ltr;border-radius:8px">0</div>
<div class="grid" style="grid-template-columns:repeat(4,1fr);max-width:260px;margin:8px auto">
<button class="btnD" onclick="cc()">C</button><button class="btnD" onclick="cd()">⌫</button><button class="btnD" onclick="cp('%')">%</button><button class="btnY" onclick="cp('/')">/</button>
<button class="btnD" onclick="cp('7')">7</button><button class="btnD" onclick="cp('8')">8</button><button class="btnD" onclick="cp('9')">9</button><button class="btnY" onclick="cp('*')">x</button>
<button class="btnD" onclick="cp('4')">4</button><button class="btnD" onclick="cp('5')">5</button><button class="btnD" onclick="cp('6')">6</button><button class="btnY" onclick="cp('-')">-</button>
<button class="btnD" onclick="cp('1')">1</button><button class="btnD" onclick="cp('2')">2</button><button class="btnD" onclick="cp('3')">3</button><button class="btnY" onclick="cp('+')">+</button>
<button class="btnD" onclick="cp('0')">0</button><button class="btnD" onclick="cp('.')">.</button><button class="btnY" style="grid-column:span 2" onclick="ce()">=</button>
</div>
</div>
<div id="code" class="card" style="display:none">
<h2>💻 برمج 100 سؤال =5</h2>
<button class="btnY" onclick="nextQuiz()">سؤال جديد</button>
<div id="quizBox" style="margin-top:10px"></div>
</div>
<div id="rank" class="card" style="display:none">
<h2>🏆 أفضل 5 + كاس</h2>
<div id="rankList"></div>
<h2>🧹 محو النقاط</h2>
<button class="btnD" onclick="clearPts('all')">نقاط الكل</button>
<button class="btnD" onclick="clearPts('allExceptMe')">الكل ما عدا انا</button>
<button class="btnD" onclick="clearPts('me')">نقاطي انا</button>
<div style="display:flex;gap:4px;margin-top:8px"><input id="clearOneName" placeholder="اسم"><button class="btnY" onclick="clearPts('one')">محو...</button></div>
</div>
<script>
var myName='انا';var points=parseInt(localStorage.getItem('myPoints')||'0');var players=JSON.parse(localStorage.getItem('players')||'{}');if(!players[myName])players[myName]=points;
function save(){localStorage.setItem('myPoints',points);localStorage.setItem('players',JSON.stringify(players));document.getElementById('myPoints').innerText=points;renderRank()}
function addPts(p){points+=p;players[myName]=points;save();if(p>0)alert('+'+p)}
function showSec(id){document.getElementById('games').style.display='none';document.getElementById('calc').style.display='none';document.getElementById('code').style.display='none';document.getElementById('rank').style.display='none';document.getElementById(id).style.display='block';if(id=='rank')renderRank()}
document.getElementById('myPoints').innerText=points;
var xoBoardEl=document.getElementById('xoBoard');var xoCells=[];var xoDiff='medium';var xoMap={easy:2,medium:3,hard:10};
function setDiff(d){xoDiff=d;resetXO()}
function addPts(p){points+=p;players[myName]=points;save()}
function renderXO(){var cells=document.querySelectorAll('.xocell');for(var i=0;i<cells.length;i++){cells[i].innerText=xoCells[i]}}
function xoClick(i){if(xoCells[i]!='')return;xoCells[i]='X';renderXO();if(checkWin('X')){addPts(xoMap[xoDiff]);document.getElementById('xoStatus').innerText='فزت +'+xoMap[xoDiff];return}if(xoCells.every(function(v){return v!=''})){document.getElementById('xoStatus').innerText='تعادل';return}setTimeout(robotMove,300)}
function robotMove(){var av=[];for(var i=0;i<9;i++){if(xoCells[i]=='')av.push(i)}if(!av.length)return;var m=av[Math.floor(Math.random()*av.length)];xoCells[m]='O';renderXO();if(checkWin('O')){document.getElementById('xoStatus').innerText='الروبوت فاز'}}
function checkWin(p){var w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(var k=0;k<w.length;k++){if(xoCells[w[k][0]]==p && xoCells[w[k][1]]==p && xoCells[w[k][2]]==p)return true}return false}
var memIcons=['A','B','C','D','E','F','G','H'];var memFirst=null;var memLock=false;
function initMem(){var g=document.getElementById('memGrid');g.innerHTML='';memFirst=null;memLock=false;var cards=memIcons.concat(memIcons).sort(function(){return Math.random()-0.5});for(var i=0;i<cards.length;i++){var d=document.createElement('div');d.className='memcard';d.setAttribute('data-icon',cards[i]);d.innerText='?';d.onclick=function(){flipMem(this)};g.appendChild(d)}}
function flipMem(el){if(memLock||el.getAttribute('data-done'))return;el.innerText=el.getAttribute('data-icon');el.style.background='#eab308';if(!memFirst){memFirst=el}else{if(memFirst.getAttribute('data-icon')==el.getAttribute('data-icon')){memFirst.setAttribute('data-done','1');el.setAttribute('data-done','1');memFirst.style.background='#22c55e';el.style.background='#22c55e';memFirst=null;var done=document.querySelectorAll('[data-done]').length;if(done==16){addPts(4);alert('فزت +4')}}else{memLock=true;setTimeout(function(){memFirst.innerText='?';memFirst.style.background='#2a2a2a';el.innerText='?';el.style.background='#2a2a2a';memFirst=null;memLock=false},600)}}}
var guessNum;function resetGuess(){guessNum=Math.floor(Math.random()*100)+1;document.getElementById('guessHint').innerText='خمن 1-100'}function checkGuess(){var v=parseInt(document.getElementById('guessInput').value);if(v==guessNum){addPts(5);alert('صح +5');resetGuess()}else if(v<guessNum){document.getElementById('guessHint').innerText='أكبر'}else{document.getElementById('guessHint').innerText='أصغر'}}resetGuess();
var calcStr='';function cp(v){calcStr+=v;document.getElementById('calcDisp').innerText=calcStr}function cc(){calcStr='';document.getElementById('calcDisp').innerText='0'}function cd(){calcStr=calcStr.slice(0,-1);document.getElementById('calcDisp').innerText=calcStr||'0'}function ce(){try{var r=eval(calcStr);document.getElementById('calcDisp').innerText=r;calcStr=''+r}catch(e){}}
var quizBank=[];for(var i=0;i<100;i++){quizBank.push({q:'سؤال '+(i+1)+': '+i+' % 7 =?',a:''+(i%7)})}
function nextQuiz(){var q=quizBank[Math.floor(Math.random()*100)];var b=document.getElementById('quizBox');b.innerHTML='<h4>'+q.q+'</h4><button class="btnY" onclick="addPts(5)" style="width:100%">الاجابة: '+q.a+' (اضغط +5)</button>'}
function renderRank(){var arr=[];for(var k in players){arr.push([k,players[k]])}arr.sort(function(a,b){return b[1]-a[1]});arr=arr.slice(0,5);var list=document.getElementById('rankList');list.innerHTML='';for(var i=0;i<arr.length;i++){var cup=i==0?'🏆':i==1?'🥈':i==2?'🥉':'⭐';var d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;background:#2a2a2a;padding:8px;border-radius:8px;margin:4px 0';d.innerHTML='<div>'+cup+' '+arr[i][0]+'</div><div>'+arr[i][1]+'</div>';list.appendChild(d)}}
function clearPts(m){if(m=='all'){players={};players[myName]=0;points=0;save()}else if(m=='allExceptMe'){var me=players[myName]||0;players={};players[myName]=me;save()}else if(m=='me'){points=0;players[myName]=0;save()}else if(m=='one'){var n=document.getElementById('clearOneName').value;if(players[n]){delete players[n];save()}}}
renderRank();resetXO();initMem();nextQuiz();
</script>
</body>
</html>
