<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f23;color:#fff;font-family:system-ui;padding:20px}
h1{text-align:center;margin-bottom:20px;color:#8b5cf6}
.games{display:flex;flex-direction:column;gap:15px;max-width:500px;margin:0 auto}
.game-card{background:#1e1e3f;border:1px solid #3a3a6a;border-radius:16px;padding:20px;cursor:pointer;transition:.2s}
.game-card:hover{transform:translateY(-3px);border-color:#8b5cf6}
.game-card h3{font-size:20px;margin-bottom:5px}
.game-card p{opacity:.6;font-size:14px}
.leaderboard{background:#1e1e3f;border-radius:16px;padding:15px;max-width:500px;margin:20px auto}
.admin{background:#1e1e3f;border-radius:16px;padding:20px;max-width:500px;margin:20px auto}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;font-size:16px}
button{background:#8b5cf6;color:#fff;cursor:pointer;font-weight:bold}
button:hover{background:#7c3aed}
button:disabled{opacity:.65;cursor:not-allowed}
.secondary{background:#2a2a5a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0;max-width:300px}
.cell{aspect-ratio:1;background:#2a2a5a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;cursor:pointer}
.cell:hover{background:#3a3a6a}
.difficulty{display:flex;gap:8px;margin:10px 0}
.difficulty button{flex:1;padding:8px;font-size:14px}
.difficulty button.active{background:#10b981}
.hidden{display:none}
</style>
</head>
<body>
<h1>🎮 ألعاب سيف</h1>

<div class="games">
  <div class="game-card" onclick="openGame('xo')">
    <h3>❌⭕ XO - ضد الروبوت</h3>
    <p>العب ضد الكمبيوتر واختار الصعوبة</p>
  </div>
  <div class="game-card" onclick="openGame('memory')">
    <h3>🧠 لعبة الذاكرة</h3>
    <p>افتكر الأماكن</p>
  </div>
  <div class="game-card" onclick="openGame('click')">
    <h3>👆 سرعة الضغط</h3>
    <p>اضغط أسرع ما يمكن</p>
  </div>
</div>

<div id="gameArea" class="admin hidden">
  <button class="secondary" onclick="closeGame()">⬅️ رجوع</button>
  <div id="gameContent"></div>
</div>

<div class="leaderboard">
  <h3>🏆 النقاط</h3>
  <div id="board"></div>
</div>

<div class="admin">
  <h3>🗑️ محو النقاط</h3>
  <input type="password" id="pass" placeholder="الباسورد">
  <div style="display:flex;gap:8px">
    <button onclick="deleteAll()">محو الكل</button>
    <button onclick="deleteAllExceptMe()">محو الكل ماعدا انا</button>
    <button class="secondary" onclick="deleteMe()">محو نقاطي</button>
  </div>
  <select id="userSelect"></select>
  <button class="secondary" onclick="deleteSelected()">امسح المختار</button>
  <p id="msg" style="margin-top:10px;color:#10b981"></p>
</div>

<script>
const PASSWORD = "121312";
let currentUser = localStorage.getItem('saif_user') || prompt("اسمك ايه؟") || "لاعب";
localStorage.setItem('saif_user', currentUser);
let scores = JSON.parse(localStorage.getItem('saif_scores') || '{}');
if(!scores[currentUser]) scores[currentUser]=0;
let difficulty = 'hard';
let robotTimer;
let clickTimer;

function saveScores(){ localStorage.setItem('saif_scores', JSON.stringify(scores)); renderBoard(); renderUsers(); }
function addPoints(p){
  scores[currentUser] = (scores[currentUser]||0)+p;
  saveScores();
}
function renderBoard(){
  const board=document.getElementById('board');
  board.replaceChildren();
  const entries=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ board.textContent="لسه مفيش نقاط"; return; }
  entries.forEach(([name,score])=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #333';
    const player=document.createElement('span');
    player.textContent=name;
    const points=document.createElement('b');
    points.textContent=score;
    row.append(player,points);
    board.appendChild(row);
  });
}
function renderUsers(){
  const sel=document.getElementById('userSelect');
  sel.replaceChildren();
  Object.keys(scores).forEach(user=>{
    const option=document.createElement('option');
    option.value=user;
    option.textContent=user;
    sel.appendChild(option);
  });
}
function clearGameTimers(){
  clearTimeout(robotTimer);
  clearTimeout(clickTimer);
}
function openGame(name){
  clearGameTimers();
  document.getElementById('gameArea').classList.remove('hidden');
  window.scrollTo(0,0);
  if(name==='xo') renderXO();
  if(name==='memory') renderMemory();
  if(name==='click') renderClick();
}
function closeGame(){
  clearGameTimers();
  document.getElementById('gameArea').classList.add('hidden');
}

function renderXO(){
  clearTimeout(robotTimer);
  document.getElementById('gameContent').innerHTML = `
    <h3>❌⭕ XO ضد الروبوت</h3>
    <div class="difficulty">
      <button onclick="setDiff('easy')" id="d-easy">سهل</button>
      <button onclick="setDiff('medium')" id="d-medium">متوسط</button>
      <button onclick="setDiff('hard')" id="d-hard" class="active">صعب</button>
    </div>
    <div class="grid" id="xoGrid"></div>
    <p id="xoStatus">دورك - أنت X</p>
    <button class="secondary" onclick="renderXO()">إعادة</button>
  `;
  setDiff(difficulty);
  initXO();
}
function setDiff(d){
  difficulty=d;
  document.querySelectorAll('.difficulty button').forEach(b=>b.classList.remove('active'));
  let el=document.getElementById('d-'+d);
  if(el) el.classList.add('active');
}
let xoBoard, xoOver;
function initXO(){
  xoBoard=Array(9).fill(''); xoOver=false;
  let g=document.getElementById('xoGrid');
  g.innerHTML='';
  for(let i=0;i<9;i++){
    let c=document.createElement('div'); c.className='cell'; c.onclick=()=>xoMove(i); g.appendChild(c);
  }
  document.getElementById('xoStatus').textContent="دورك - أنت X";
}
function xoMove(i){
  if(xoBoard[i]||xoOver) return;
  xoBoard[i]='X'; drawXO();
  if(checkWin('X')){ winXO('X'); return; }
  if(xoBoard.every(v=>v)){ xoOver=true; drawXO("تعادل!"); return; }
  document.getElementById('xoStatus').textContent="الروبوت بيفكر...";
  robotTimer=setTimeout(robotMove, 400);
}
function robotMove(){
  if(xoOver) return;
  let move = -1;
  if(difficulty==='easy'){
    move = randomMove();
  } else if(difficulty==='medium'){
    move = Math.random()<0.6 ? findBestMove() : randomMove();
    if(move===null) move=randomMove();
  } else {
    move = findBestMove();
  }
  if(move>=0) xoBoard[move]='O';
  drawXO();
  if(checkWin('O')){ winXO('O'); return; }
  if(xoBoard.every(v=>v)){ xoOver=true; drawXO("تعادل!"); return; }
  document.getElementById('xoStatus').textContent="دورك";
}
function randomMove(){ let a=xoBoard.map((v,i)=>v?'':i).filter(v=>v!==''); return a.length ? a[Math.floor(Math.random()*a.length)] : -1; }
function minimax(player){
  if(checkWin('O')) return 10;
  if(checkWin('X')) return -10;
  if(xoBoard.every(Boolean)) return 0;
  let best=player==='O' ? -Infinity : Infinity;
  for(let i=0;i<9;i++){
    if(xoBoard[i]) continue;
    xoBoard[i]=player;
    const score=minimax(player==='O' ? 'X' : 'O');
    xoBoard[i]='';
    best=player==='O' ? Math.max(best,score) : Math.min(best,score);
  }
  return best;
}
function findBestMove(){
  let bestScore=-Infinity, bestMove=-1;
  for(let i=0;i<9;i++){
    if(xoBoard[i]) continue;
    xoBoard[i]='O';
    const score=minimax('X');
    xoBoard[i]='';
    if(score>bestScore){ bestScore=score; bestMove=i; }
  }
  return bestMove;
}
function checkWin(p){ let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(c=>c.every(i=>xoBoard[i]===p)); }
function drawXO(msg){
  document.querySelectorAll('#xoGrid .cell').forEach((c,i)=>c.textContent=xoBoard[i]);
  if(msg) document.getElementById('xoStatus').textContent=msg;
}
function winXO(p){
  xoOver=true;
  if(p==='X'){
    let pts = difficulty==='easy'?3:difficulty==='medium'?5:10;
    addPoints(pts);
    document.getElementById('xoStatus').textContent="كسبت! 🎉";
  } else {
    document.getElementById('xoStatus').textContent="الروبوت كسب 🤖";
  }
}
function renderMemory(){
  document.getElementById('gameContent').innerHTML=`<h3>🧠 ذاكرة</h3><div class="grid" id="memGrid"></div><p id="memStatus"></p><button class="secondary" onclick="renderMemory()">إعادة</button>`;
  let vals=[1,1,2,2,3,3,4,4].sort(()=>Math.random()-0.5);
  let g=document.getElementById('memGrid'); g.innerHTML=''; let first=null, lock=false, matched=0, finished=false;
  vals.forEach((v,i)=>{
    let c=document.createElement('div'); c.className='cell'; c.textContent='?';
    c.onclick=()=>{
      if(lock||finished||c.textContent!== '?' ) return;
      c.textContent=v;
      if(!first){ first={v,i,el:c}; }
      else{
        if(first.v===v && first.i!==i){
          matched++;
          first.el.style.background='#10b981'; c.style.background='#10b981';
          first=null;
          if(matched===4){ finished=true; addPoints(7); document.getElementById('memStatus').textContent='كسبت!'; }
        }
        else{ lock=true; const previous=first; setTimeout(()=>{ c.textContent='?'; previous.el.textContent='?'; first=null; lock=false; },800); }
      }
    }; g.appendChild(c);
  });
}
function renderClick(){
  clearTimeout(clickTimer);
  document.getElementById('gameContent').innerHTML=`<h3>👆 اضغط بسرعة</h3><button id="clickBtn" style="height:150px;font-size:24px">اضغط!</button><p id="clickScore">0</p><button class="secondary" onclick="renderClick()">إعادة</button>`;
  let sc=0; document.getElementById('clickBtn').onclick=()=>{ sc++; document.getElementById('clickScore').textContent=sc; };
  clickTimer=setTimeout(()=>{
    let b=document.getElementById('clickBtn');
    if(b){ b.disabled=true; b.textContent='خلص!'; if(sc>20){ addPoints(5); } }
  },5000);
}
function checkPass(){ if(document.getElementById('pass').value!==PASSWORD){ alert('باسورد غلط'); return false;} return true; }
function deleteAll(){ if(!checkPass()) return; if(confirm('متأكد تمسح الكل؟')){ scores={}; scores[currentUser]=0; saveScores(); msg('تم محو الكل'); } }
function deleteAllExceptMe(){ if(!checkPass()) return; let me=currentUser; let myScore=scores[me]||0; scores={}; scores[me]=myScore; saveScores(); msg('تم محو الكل ماعدا '+me); }
function deleteMe(){ if(!checkPass()) return; scores[currentUser]=0; saveScores(); msg('تم محو نقاطك'); }
function deleteSelected(){ if(!checkPass()) return; let u=document.getElementById('userSelect').value; if(u){ delete scores[u]; if(u===currentUser) scores[currentUser]=0; saveScores(); msg('تم محو '+u); } }
function msg(t){ document.getElementById('msg').textContent=t; setTimeout(()=>document.getElementById('msg').textContent='',3000); }
renderBoard(); renderUsers();
</script>
</body>
</html>
