<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif's Simple Games</title>
<style>
body{margin:0;background:#0f1220;color:#e8eaff;padding:15px;font-family:Tahoma}
h1{text-align:center;color:#5b6cff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.tab{padding:10px 14px;background:#1a1d35;border:1px solid #2a2e5a;border-radius:10px;cursor:pointer}
.tab.active{background:#5b6cff;color:white}
.section{display:none;background:#1a1d35;border-radius:16px;padding:18px;margin-top:10px;border:1px solid #2a2e5a}
.section.active{display:block}
button{padding:10px 16px;border:none;border-radius:10px;background:#5b6cff;color:white;cursor:pointer;margin:5px}
input,select{padding:10px;border-radius:10px;border:1px solid #333;background:#0f1220;color:white;width:100%;margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:auto}
.cell{aspect-ratio:1;background:#0f1220;border:2px solid #2a2e5a;border-radius:10px;font-size:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.leader-item{padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between}
.gold{background:linear-gradient(90deg,#1e3a8a,#3b82f6);border:2px solid #60a5fa}
.silver{background:linear-gradient(90deg,#374151,#9ca3af);border:2px solid #d1d5db}
.bronze{background:linear-gradient(90deg,#7c2d12,#d97706);border:2px solid #f59e0b}
.normal{background:#0f1220;border:1px solid #2a2e5a}
</style>
</head>
<body>
<h1>🎮 Saif's Simple Games</h1>
<div style="text-align:center">
<input id="username" placeholder="اكتب اسمك" style="max-width:300px">
<button onclick="saveName()">حفظ الاسم</button>
<span id="pointsDisplay"></span>
</div>
<div class="tabs">
<div class="tab active" onclick="openTab('games')">🎮 الالعاب</div>
<div class="tab" onclick="openTab('calc')">🧮 الحساب</div>
<div class="tab" onclick="openTab('code')">💻 برمج</div>
<div class="tab" onclick="openTab('typing')">⌨️ سرعة كتابتك</div>
<div class="tab" onclick="openTab('leader')">🏆 التصنيف</div>
<div class="tab" onclick="openTab('wipe')">🗑️ محو النقاط</div>
</div>
<div id="games" class="section active">
<h3>قسم الالعاب</h3>
<button onclick="showGame('xo')">XO - 5 نقاط</button>
<button onclick="showGame('rps')">حجر ورقة مقص - 3 نقاط</button>
<button onclick="showGame('guess')">التخمين - 10 نقاط</button>
<div id="xo" style="display:none;margin-top:15px"><div class="grid3" id="xoBoard"></div><p id="xoStatus"></p><button onclick="resetXO()">اعادة</button></div>
<div id="rps" style="display:none;margin-top:15px"><button onclick="playRPS('حجر')">🪨 حجر</button><button onclick="playRPS('ورقة')">📄 ورقة</button><button onclick="playRPS('مقص')">✂️ مقص</button><p id="rpsResult"></p></div>
<div id="guess" style="display:none;margin-top:15px"><input id="guessInput" type="number" placeholder="خمن 1-100"><button onclick="checkGuess()">خمن</button><p id="guessResult"></p><button onclick="newGuess()">رقم جديد</button></div>
</div>
<div id="calc" class="section"><h3>آلة حاسبة - 0 نقطة</h3><input id="calcInput" placeholder="5+5*2"><button onclick="doCalc()">احسب</button><p id="calcResult"></p></div>
<div id="code" class="section"><h3>برمجة - 5 نقاط للسؤال</h3><p id="codeQ"></p><div id="codeOpts"></div><p id="codeFeedback"></p><button onclick="nextCodeQ()">التالي</button></div>
<div id="typing" class="section"><h3>سرعة كتابتك - 5 نقاط للجملة</h3><p id="sentence" style="background:#0f1220;padding:12px;border-radius:10px"></p><input id="typingInput" placeholder="اكتب الجملة"><button onclick="checkTyping()">تحقق</button><p id="typingResult"></p><button onclick="newSentence()">جملة جديدة</button></div>
<div id="leader" class="section"><h3>🏆 التصنيف</h3><div id="leaderList"></div><button onclick="renderLeader()">تحديث</button></div>
<div id="wipe" class="section"><h3>🗑️ محو النقاط - الباسورد geo42699</h3><input id="wipePass" type="password" placeholder="الباسورد"><br><button onclick="wipeMy()">محو نقاطي</button><button onclick="wipeOthers()">محو الكل عدا انا</button><button onclick="wipeAll()">محو الكل</button><br><br><select id="wipeSelect"></select><button onclick="wipeSelected()">امسح المختار</button><p id="wipeMsg"></p></div>
<script>
let currentUser=localStorage.getItem('ssg_name')||'';
let data=JSON.parse(localStorage.getItem('ssg_data')||'{}');
let sentences=["سيف يلعب ماينكرافت كل يوم","البرمجة تحتاج صبر وتركيز كبير","حجر ورقة مقص لعبة ممتعة","تعلم الكود يفتح المستقبل امامك","سرعة الكتابة مهارة مهمة جدا","الذكاء الاصطناعي يغير العالم اليوم","الالعاب تعلم التفكير المنطقي السريع","الالة الحاسبة تحل المسائل بسرعة","التخمين يحتاج ذكاء وحدس قوي","الكود النظيف اسهل في الفهم","المبرمج الجيد يحل المشاكل يوميا","الكمبيوتر ينفذ اوامر الانسان بدقة","الانترنت يربط الناس حول العالم","التصميم الجميل يجذب المستخدمين فورا","قاعدة البيانات تخزن المعلومات بامان","الخوارزميات اساس علوم الحاسب الالي","لغات البرمجة كثيرة ومتنوعة جدا","التعلم المستمر سر النجاح الدائم","المشاريع الصغيرة تصبح كبيرة يوما","الابداع ياتي من التجربة والخطا","سيف يبني العاب باحتراف عالي","الرياضيات تساعد على فهم البرمجة","حل المشكلات مهارة اساسية للمبرمج","العمل الجماعي ينجز المشاريع بسرعة","التحدي يصنع مبرمج قوي ومبدع"];
let guessNumber=Math.floor(Math.random()*100)+1;
let xoTurn='X';
let xoBoardState=Array(9).fill('');
const codeQuestions=[{q:"لغة صفحات الويب؟",opts:["Python","HTML","C++"],a:1},{q:"print(2+3) = ؟",opts:["23","5"],a:1},{q:"رمز التعليق في بايثون؟",opts:["//","#"],a:1},{q:"CSS تعني؟",opts:["Cascading Style Sheets","Computer Style"],a:0},{q:"حلقة تكرار؟",opts:["if","for"],a:1},{q:"10 % 3 = ؟",opts:["1","3"],a:0},{q:"لغة AI؟",opts:["Python","HTML"],a:0},{q:"وظيفة git؟",opts:["ادارة الكود","رسم"],a:0}];
let codeQIndex=0,typingIndex=0;
function saveName(){let n=document.getElementById('username').value.trim();if(!n)return alert('اكتب اسمك');currentUser=n;localStorage.setItem('ssg_name',n);if(!(n in data))data[n]=0;saveData();renderLeader();populateWipeSelect();alert('تم: '+n);}
function saveData(){localStorage.setItem('ssg_data',JSON.stringify(data));updatePoints();}
function addPoints(p){if(!currentUser)return alert('اكتب اسمك فوق');if(!(currentUser in data))data[currentUser]=0;data[currentUser]+=p;saveData();renderLeader();}
function updatePoints(){document.getElementById('pointsDisplay').innerText=currentUser?`${currentUser}: ${data[currentUser]||0} نقطة`:'';document.getElementById('username').value=currentUser;}
function openTab(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');event.target.classList.add('active');if(id==='leader')renderLeader();if(id==='typing')newSentence();if(id==='code')showCodeQ();if(id==='wipe')populateWipeSelect();}
function showGame(g){document.getElementById('xo').style.display=g==='xo'?'block':'none';document.getElementById('rps').style.display=g==='rps'?'block':'none';document.getElementById('guess').style.display=g==='guess'?'block':'none';if(g==='xo')resetXO();}
function resetXO(){xoBoardState=Array(9).fill('');xoTurn='X';document.getElementById('xoStatus').innerText='دور: '+xoTurn;renderXO();}
function renderXO(){let b=document.getElementById('xoBoard');b.innerHTML='';xoBoardState.forEach((v,i)=>{let d=document.createElement('div');d.className='cell';d.innerText=v;d.onclick=()=>{if(xoBoardState[i])return;xoBoardState[i]=xoTurn;if(checkWin()){document.getElementById('xoStatus').innerText='فاز '+xoTurn+' +5';addPoints(5);xoBoardState=Array(9).fill('');}else if(xoBoardState.every(c=>c)){document.getElementById('xoStatus').innerText='تعادل';}else{xoTurn=xoTurn==='X'?'O':'X';document.getElementById('xoStatus').innerText='دور: '+xoTurn;}renderXO();};b.appendChild(d);});}
function checkWin(){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(([a,b,c])=>xoBoardState[a]&&xoBoardState[a]===xoBoardState[b]&&xoBoardState[a]===xoBoardState[c]);}
function playRPS(u){let ch=['حجر','ورقة','مقص'];let comp=ch[Math.floor(Math.random()*3)];let r='';if(u===comp)r='تعادل!';else if((u==='حجر'&&comp==='مقص')||(u==='ورقة'&&comp==='حجر')||(u==='مقص'&&comp==='ورقة')){r=`فزت! ${comp} +3`;addPoints(3);}else r=`خسرت! ${comp}`;document.getElementById('rpsResult').innerText=r;}
function newGuess(){guessNumber=Math.floor(Math.random()*100)+1;document.getElementById('guessResult').innerText='رقم جديد!';}
function checkGuess(){let g=parseInt(document.getElementById('guessInput').value);if(!g)return;if(g===guessNumber){document.getElementById('guessResult').innerText='صح! +10 🎉';addPoints(10);newGuess();}else if(g<guessNumber)document.getElementById('guessResult').innerText='اكبر ↑';else document.getElementById('guessResult').innerText='اصغر ↓';}
function calculate(expression){
let position=0;
function skipSpaces(){while(/\s/.test(expression[position]||''))position++;}
function parsePrimary(){
skipSpaces();
if(expression[position]==='('){position++;let value=parseExpression();skipSpaces();if(expression[position]!==')')throw new Error('Expected closing parenthesis');position++;return value;}
let number=expression.slice(position).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);
if(!number)throw new Error('Expected a number');
position+=number[0].length;
return Number(number[0]);
}
function parseUnary(){skipSpaces();if(expression[position]==='+'){position++;return parseUnary();}if(expression[position]==='-'){position++;return -parseUnary();}return parsePrimary();}
function parseTerm(){let value=parseUnary();while(true){skipSpaces();let operator=expression[position];if(operator!=='*'&&operator!=='/')return value;position++;let next=parseUnary();value=operator==='*'?value*next:value/next;}}
function parseExpression(){let value=parseTerm();while(true){skipSpaces();let operator=expression[position];if(operator!=='+'&&operator!=='-')return value;position++;let next=parseTerm();value=operator==='+'?value+next:value-next;}}
let result=parseExpression();skipSpaces();if(position!==expression.length||!Number.isFinite(result))throw new Error('Invalid expression');return result;
}
function doCalc(){try{let r=calculate(document.getElementById('calcInput').value);document.getElementById('calcResult').innerText='= '+r;addPoints(0);}catch{document.getElementById('calcResult').innerText='خطأ';}}
function showCodeQ(){let q=codeQuestions[codeQIndex];document.getElementById('codeQ').innerText=q.q;let o=document.getElementById('codeOpts');o.innerHTML='';q.opts.forEach((opt,i)=>{let b=document.createElement('button');b.innerText=opt;b.onclick=()=>{if(i===q.a){document.getElementById('codeFeedback').innerText='صح! +5';addPoints(5);}else document.getElementById('codeFeedback').innerText='غلط! الصح: '+q.opts[q.a];};o.appendChild(b);});}
function nextCodeQ(){codeQIndex=(codeQIndex+1)%codeQuestions.length;document.getElementById('codeFeedback').innerText='';showCodeQ();}
function newSentence(){typingIndex=Math.floor(Math.random()*sentences.length);document.getElementById('sentence').innerText=sentences[typingIndex];document.getElementById('typingInput').value='';}
function checkTyping(){let inp=document.getElementById('typingInput').value.trim();if(inp===sentences[typingIndex]){document.getElementById('typingResult').innerText='ممتاز! +5';addPoints(5);newSentence();}else document.getElementById('typingResult').innerText='غلط';}
function renderLeader(){let s=Object.entries(data).sort((a,b)=>b[1]-a[1]);let l=document.getElementById('leaderList');l.replaceChildren();s.forEach(([n,p],i)=>{let d=document.createElement('div');d.className='leader-item '+(i===0?'gold':i===1?'silver':i===2?'bronze':'normal');let label=document.createElement('span');let col=i===0?' 🔵 ازرق':i===1?' ⚪ رمادي':i===2?' 🟤 برونز':'';let trophy=i<3?' 🏆':'';label.textContent=`${i+1}. ${n}${col}${trophy}`;let points=document.createElement('span');points.textContent=p;d.append(label,points);l.appendChild(d);});}
function populateWipeSelect(){let sel=document.getElementById('wipeSelect');sel.innerHTML='';Object.keys(data).forEach(n=>{let o=document.createElement('option');o.value=n;o.innerText=n;sel.appendChild(o);});}
function checkPass(){let p=document.getElementById('wipePass').value;if(p!=='geo42699'){document.getElementById('wipeMsg').innerText='الباسورد غلط!';return false;}return true;}
function wipeMy(){if(!checkPass())return;data[currentUser]=0;saveData();document.getElementById('wipeMsg').innerText='تم محو نقاطك';renderLeader();}
function wipeOthers(){if(!checkPass())return;Object.keys(data).forEach(k=>{if(k!==currentUser)data[k]=0;});saveData();document.getElementById('wipeMsg').innerText='تم محو الكل عدا انت';renderLeader();populateWipeSelect();}
function wipeAll(){if(!checkPass())return;Object.keys(data).forEach(k=>data[k]=0);saveData();document.getElementById('wipeMsg').innerText='تم محو الكل';renderLeader();populateWipeSelect();}
function wipeSelected(){if(!checkPass())return;let sel=document.getElementById('wipeSelect').value;data[sel]=0;saveData();document.getElementById('wipeMsg').innerText='تم محو '+sel;renderLeader();populateWipeSelect();}
updatePoints();renderLeader();resetXO();showCodeQ();newSentence();populateWipeSelect();
</script>
</body>
</html>
